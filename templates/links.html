<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(~{::title}, ~{::content})}">
<head><title th:text="|友链 · ${site.title}|">links</title></head>
<body><th:block th:fragment="content">
<header class="page-heading"><h1 >友人来信</h1></header>
<th:block th:if="${linkFinder != null}" th:with="groups=${linkFinder.groupBy()}">
  <section class="link-group" th:each="group : ${groups}">
    <h2 th:text="${group.spec?.displayName ?: '友链'}">友链</h2>
    <ul class="catalog"><li th:each="link : ${group.links}"><a th:href="${link.spec.url}" target="_blank" rel="noopener noreferrer">
      <img th:if="${not #strings.isEmpty(link.spec.logo)}" th:src="${link.spec.logo}" alt="" width="40" height="40" loading="lazy">
      <strong th:text="${link.spec.displayName}">站点名称</strong><span aria-hidden="true">↗</span>
      <p th:text="${link.spec.description}">站点简介</p>
    </a></li></ul>
  </section><p class="empty" th:if="${#lists.isEmpty(groups)}">暂无友链。</p>
</th:block><p class="empty" th:if="${linkFinder == null}">友链插件尚未启用。</p>
</th:block></body></html>
