<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(~{::title}, ~{::content})}">
<head><title th:text="|归档 · ${site.title}|">archives</title></head>
<body><th:block th:fragment="content">
<header class="page-heading"><h1 >文章归档</h1></header>
<section class="archive" th:each="year : ${archives.items}">
  <h2 th:text="${year.year}">2026</h2>
  <div><section class="month" th:each="month : ${year.months}">
    <h3 th:text="|${month.month} 月|">十一月</h3>
    <ul><li th:each="item : ${month.posts}">
      <time th:text="${#temporals.format(item.spec.publishTime, 'MM.dd')}"></time>
      <a th:href="@{${item.status.permalink}}" th:text="${item.spec.title}">文章标题</a>
    </li></ul>
  </section></div>
</section>
<p class="empty" th:if="${#lists.isEmpty(archives.items)}">暂无归档。</p>
<nav th:replace="~{modules/journal :: pagination(${archives})}"></nav>
</th:block></body></html>
