<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(~{::title}, ~{::content})}">
<head><title th:text="|分类 · ${site.title}|">categories</title></head>
<body><th:block th:fragment="content">
<header class="page-heading"><h1 >分类</h1></header>
<ul class="catalog">
  <li th:each="item : ${categories}"><a th:href="@{${item.status.permalink}}">
    <strong th:text="${item.spec.displayName}">名称</strong>
    <span th:text="|${item.postCount} 篇|">0 篇</span>
    <p th:if="${not #strings.isEmpty(item.spec.description)}" th:text="${item.spec.description}"></p>
  </a></li>
</ul>
<p class="empty" th:if="${#lists.isEmpty(categories)}">暂无分类。</p>
</th:block></body></html>
