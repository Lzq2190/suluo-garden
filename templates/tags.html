<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(~{::title}, ~{::content})}">
<head><title th:text="|标签 · ${site.title}|">tags</title></head>
<body><th:block th:fragment="content">
<header class="page-heading"><h1 >标签</h1></header>
<ul class="catalog">
  <li th:each="item : ${tags}"><a th:href="@{${item.status.permalink}}">
    <strong th:text="${item.spec.displayName}">名称</strong>
    <span th:text="|${item.postCount} 篇|">0 篇</span>

  </a></li>
</ul>
<p class="empty" th:if="${#lists.isEmpty(tags)}">暂无标签。</p>
</th:block></body></html>
