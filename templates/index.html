<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(null, ~{::content})}"><body>
<th:block th:fragment="content">
  <section class="cover" th:classappend="${theme.config?.effect?.show_hills == false} ? 'text-cover'">
    <div class="cover-copy">
      <p class="imprint"><i aria-hidden="true"></i>江南花谱</p>
      <h1 th:text="${theme.config?.basic?.hero_title ?: site.title}">一窗烟雨</h1>
      <p class="subtitle" th:text="${theme.config?.basic?.hero_subtitle ?: site.subtitle}">花开彼岸，雨落江南</p>
      <a class="primary" href="#journal">翻阅近作 <span aria-hidden="true">↘</span></a>
    </div>
    <figure class="plate" th:if="${theme.config?.effect?.show_hills != false}" th:classappend="${theme.config?.effect?.hero_style == 'ink'} ? 'ink'" th:attr="data-parallax=${theme.config?.effect?.show_parallax != false}">
      <div class="plate-art"><img th:src="@{/themes/suluo-garden/assets/images/lycoris.webp}" width="1536" height="1024" alt="三枝朱红彼岸花，细长花丝从反卷的花瓣间伸出" fetchpriority="high">
        <span class="moon" aria-hidden="true" th:if="${theme.config?.effect?.show_moon != false}"></span>
        <div class="weather" aria-hidden="true"></div>
      </div>
      <figcaption><span>石蒜 · 彼岸花</span><i lang="la">Lycoris radiata</i></figcaption>
    </figure>
  </section>
  <section class="journal" id="journal" aria-labelledby="recent-heading">
    <header class="side-heading"><h2 id="recent-heading">近作</h2>
      <p th:text="${theme.config?.basic?.hero_inscription ?: '花叶不相见，一秋一忘川'}">花叶不相见，一秋一忘川</p>
      <a th:href="@{/archives}">文章归档 ↗</a>
    </header>
    <section th:replace="~{modules/journal :: entries(${posts})}"></section>
  </section>
</th:block></body></html>
