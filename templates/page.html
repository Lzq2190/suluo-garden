<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(~{::title}, ~{::content})}">
<head><title th:text="|${singlePage.spec.title} · ${site.title}|">page</title></head>
<body><th:block th:fragment="content">
<article class="reader">
  <header class="reader-head">
    <a class="back" th:href="@{/}">← 首页</a>
    <h1 th:text="${singlePage.spec.title}">文章标题</h1>

  </header>

  <div class="prose" th:utext="${singlePage.content.content}"></div>

  <section th:if="${haloCommentEnabled}"><halo:comment group="content.halo.run" kind="SinglePage" th:attr="name=${singlePage.metadata.name}" /></section>
</article>
</th:block></body></html>
