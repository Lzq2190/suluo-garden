<!doctype html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org" th:fragment="html(head, content)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:if="${head == null}" th:text="${site.title}">江南花谱</title>
  <th:block th:if="${head != null}"><th:block th:replace="${head}"></th:block></th:block>
  <link rel="icon" th:if="${not #strings.isEmpty(site.favicon)}" th:href="${site.favicon}">
  <script>
    try {
      const saved = localStorage.getItem('jn-theme');
      document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (_) {}
  </script>
  <link rel="stylesheet" th:href="@{/themes/suluo-garden/assets/css/main.css(v=${theme.spec.version})}">
  <script defer th:src="@{/themes/suluo-garden/assets/js/garden.js(v=${theme.spec.version})}"></script>
</head>
<body th:style="|--accent:${theme.config?.basic?.accent_color ?: '#A33D32'}|"
      th:attr="data-scene=${theme.config?.bloom?.default_scene ?: 'spider'},data-count=${theme.config?.bloom?.particle_count ?: 24},data-ripple=${theme.config?.effect?.show_ripple != false}">
  <a class="skip" href="#main">跳至正文</a>
  <header class="masthead wrap" th:classappend="${theme.config?.effect?.show_eaves != false} ? 'ruled'">
    <a class="brand" th:href="@{/}"><span class="seal" aria-hidden="true">花譜</span><span th:text="${site.title}">一窗烟雨</span></a>
    <nav class="menu" aria-label="主导航">
      <a th:href="@{/}">首页</a><a th:href="@{/archives}">归档</a><a th:href="@{/categories}">分类</a><a th:href="@{/tags}">标签</a><a th:if="${linkFinder != null}" th:href="@{/links}">友链</a>
    </nav>
    <div class="tools">
      <button type="button" data-weather th:if="${theme.config?.bloom?.allow_switch != false}" aria-label="切换花事">花</button>
      <button type="button" data-theme-toggle aria-label="切换明暗模式" title="切换明暗模式">◐</button>
    </div>
  </header>
  <main id="main" class="wrap" tabindex="-1"><th:block th:replace="${content}"></th:block></main>
  <footer class="footer wrap">
    <p th:text="${theme.config?.basic?.footer_poetry ?: '彼岸花开，此岸人独立'}">彼岸花开，此岸人独立</p>
    <div><a th:href="@{/}" th:text="${site.title}">一窗烟雨</a><span aria-hidden="true"> / </span><a href="https://www.halo.run/">Halo</a></div>
    <div class="injection"><halo:footer /></div>
  </footer>
</body>
</html>
