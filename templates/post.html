<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(~{::title}, ~{::content})}">
<head><title th:text="|${post.spec.title} · ${site.title}|">post</title></head>
<body><th:block th:fragment="content">
<article class="reader">
  <header class="reader-head">
    <a class="back" th:href="@{/archives}">← 归档</a>
    <h1 th:text="${post.spec.title}">文章标题</h1>
    <div class="byline"><time th:text="${#temporals.format(post.spec.publishTime, 'yyyy.MM.dd')}"></time>
      <span th:if="${post.owner != null}" th:text="${post.owner.displayName}"></span>
      <span th:text="|${post.stats?.visit ?: 0} 阅读|"></span>
      <span th:text="|${post.stats?.comment ?: 0} 评论|"></span>
      <a th:each="cat : ${post.categories}" th:href="@{${cat.status.permalink}}" th:text="${cat.spec.displayName}"></a>
    </div>
  </header>
  <img class="reader-cover" th:if="${not #strings.isEmpty(post.spec.cover)}" th:src="${post.spec.cover}" alt="">
  <div class="prose" th:utext="${post.content.content}"></div>
  <div class="byline tags"><a th:each="tag : ${post.tags}" th:href="@{${tag.status.permalink}}" th:text="|# ${tag.spec.displayName}|"></a></div>
  <nav class="neighbors" th:with="cursor=${postFinder.cursor(post.metadata.name)}" aria-label="相邻文章">
    <a th:if="${cursor.hasPrevious()}" th:href="@{${cursor.previous.status.permalink}}"><small>上一篇</small><span th:text="${cursor.previous.spec.title}"></span></a>
    <a th:if="${cursor.hasNext()}" th:href="@{${cursor.next.status.permalink}}"><small>下一篇</small><span th:text="${cursor.next.spec.title}"></span></a>
  </nav>
  <section th:if="${haloCommentEnabled}"><halo:comment group="content.halo.run" kind="Post" th:attr="name=${post.metadata.name}" /></section>
</article>
</th:block></body></html>
