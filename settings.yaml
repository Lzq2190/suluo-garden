apiVersion: v1alpha1
kind: Setting
metadata:
  name: suluo-garden-setting
spec:
  forms:
    - group: basic
      label: 题字
      formSchema:
        - $formkit: text
          name: hero_title
          label: 首屏大标题
          value: 一窗烟雨
          help: 留空则使用站点标题
        - $formkit: text
          name: hero_subtitle
          label: 首屏副标题
          value: 花开彼岸，雨落江南
          help: 显示在大标题下方
        - $formkit: text
          name: hero_inscription
          label: 近作题签
          value: 花叶不相见，一秋一忘川
          help: 显示在首页近作栏
        - $formkit: text
          name: footer_poetry
          label: 页脚诗句
          value: 彼岸花开，此岸人独立
          help: 显示在页脚
        - $formkit: color
          name: accent_color
          label: 朱砂强调色
          value: "#B3322B"
          help: 印章、链接与强调色，夜间配色自动提亮
    - group: bloom
      label: 花事
      formSchema:
        - $formkit: select
          name: default_scene
          label: 默认花事
          value: spider
          help: 访客首次进入时的飘落效果；右上角可自行切换
          options:
            - label: 彼岸（落花 + 萤火）
              value: spider
            - label: 细雨
              value: rain
            - label: 桂雨
              value: osmanthus
            - label: 静（无粒子）
              value: still
        - $formkit: number
          name: particle_count
          label: 落花数量
          value: 24
          min: 0
          max: 180
          step: 2
          help: 桌面端数量，移动端自动减半；设为 0 可完全关闭
        - $formkit: checkbox
          name: allow_switch
          label: 显示花事切换按钮
          value: true
          help: 关闭后访客不能切换
    - group: effect
      label: 园景
      formSchema:
        - $formkit: select
          name: hero_style
          label: 首屏画面
          value: landscape
          options:
            - label: 彩绘标本
              value: landscape
            - label: 单色标本
              value: ink
          help: 选择彼岸花图版的着色方式。
        - $formkit: checkbox
          name: show_moon
          label: 显示月牙印记
          value: true
          help: 图版角落的月牙
        - $formkit: checkbox
          name: show_eaves
          label: 页眉双线
          value: true
          help: 使用双线分隔页眉与正文
        - $formkit: checkbox
          name: show_hills
          label: 显示花谱图版
          value: true
          help: 关闭时使用纯文字封面
        - $formkit: checkbox
          name: show_parallax
          label: 图版视差
          value: true
          help: 关闭可减少动画
        - $formkit: checkbox
          name: show_ripple
          label: 点击朱晕
          value: true
          help: 点击空白处泛起朱色水纹
